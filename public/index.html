<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passkey Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #f5f5f5;
    }
    .card {
      background: #fff; border-radius: 12px;
      padding: 2rem; width: 100%; max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input {
      width: 100%; padding: .6rem .75rem; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 1rem; margin-bottom: 1rem;
    }
    button {
      width: 100%; padding: .7rem; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-reg { background: #1d4ed8; color: #fff; margin-bottom: .5rem; }
    .btn-auth { background: #059669; color: #fff; }
    .msg {
      margin-top: 1rem; padding: .75rem; border-radius: 8px;
      font-size: .875rem; text-align: center; display: none;
    }
    .msg.success { display: block; background: #ecfdf5; color: #065f46; }
    .msg.error   { display: block; background: #fef2f2; color: #991b1b; }
    hr { margin: 1.5rem 0; border: none; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
<div class="card">
  <h1>Passkey Demo</h1>

  <label for="username">用户名</label>
  <input id="username" type="text" placeholder="输入用户名" autocomplete="webauthn" />

  <button class="btn-reg" id="btnRegister">注册 Passkey</button>
  <button class="btn-auth" id="btnAuth">使用 Passkey 登录</button>

  <div class="msg" id="msg"></div>

  <hr />
  <p style="font-size:.75rem;color:#9ca3af;text-align:center;">
    基于 <a href="https://simplewebauthn.dev" target="_blank">SimpleWebAuthn</a>
  </p>
</div>

<script type="importmap">
{
  "imports": {
    "@simplewebauthn/browser": "https://esm.sh/@simplewebauthn/browser@13.3.0"
  }
}
</script>
<script type="module">
import { startRegistration, startAuthentication } from "@simplewebauthn/browser";

const $ = (id) => document.getElementById(id);
const msg = (text, ok) => {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg " + (ok ? "success" : "error");
};

function getUsername() {
  const v = $("username").value.trim();
  if (!v) { msg("请先输入用户名", false); return null; }
  return v;
}

// ── Register ──────────────────────────────────────────────

$("btnRegister").onclick = async () => {
  const username = getUsername();
  if (!username) return;

  const btn = $("btnRegister");
  btn.disabled = true;
  msg("");

  try {
    // 1. Get registration options from server
    const optsRes = await fetch("/register/options", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username }),
    });
    const options = await optsRes.json();

    // 2. Create credential in browser
    const regResp = await startRegistration({ optionsJSON: options });

    // 3. Verify with server
    const verifyRes = await fetch("/register/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username,
        registrationResponse: regResp,
      }),
    });
    const result = await verifyRes.json();

    if (result.verified) {
      msg("Passkey 注册成功！", true);
    } else {
      msg("注册验证失败: " + (result.error || "未知错误"), false);
    }
  } catch (e) {
    msg("注册出错: " + e.message, false);
  } finally {
    btn.disabled = false;
  }
};

// ── Authenticate ──────────────────────────────────────────

$("btnAuth").onclick = async () => {
  const username = getUsername();
  if (!username) return;

  const btn = $("btnAuth");
  btn.disabled = true;
  msg("");

  try {
    // 1. Get authentication options
    const optsRes = await fetch("/auth/options", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username }),
    });
    const options = await optsRes.json();

    // 2. Get credential in browser
    const authResp = await startAuthentication({ optionsJSON: options });

    // 3. Verify with server
    const verifyRes = await fetch("/auth/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username,
        authenticationResponse: authResp,
      }),
    });
    const result = await verifyRes.json();

    if (result.verified) {
      msg("登录成功！", true);
    } else {
      msg("登录验证失败: " + (result.error || "未知错误"), false);
    }
  } catch (e) {
    msg("登录出错: " + e.message, false);
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
